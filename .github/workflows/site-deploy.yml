name: نشر موقع رحلة على Cloudflare
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  workflow_dispatch: {}
concurrency: site-deploy
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: الاختبارات
        run: node --test tests/*.test.mjs
      - name: فحص الأنواع
        run: pnpm exec tsc --noEmit --incremental false
      - name: البناء
        run: pnpm build
      - name: تأكد إن المفاتيح موجودة
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::ناقص CLOUDFLARE_API_TOKEN أو CLOUDFLARE_ACCOUNT_ID في أسرار المستودع، تخطيت النشر"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: قاعدة البيانات وإعداد النشر
        if: env.SKIP != '1'
        run: |
          find_db() { pnpm exec wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="rihla-db");process.stdout.write(x?x.uuid:"")})'; }
          ID=$(find_db)
          if [ -z "$ID" ]; then pnpm exec wrangler d1 create rihla-db >/dev/null; ID=$(find_db); fi
          node -e '
            const fs=require("fs"),p="dist/server/wrangler.json",c=JSON.parse(fs.readFileSync(p));
            c.name="rihla";c.topLevelName="rihla";
            c.d1_databases=[{binding:"DB",database_name:"rihla-db",database_id:process.argv[1],migrations_dir:"../../drizzle"}];
            c.vars={...(c.vars||{}),OWNER_EMAIL:"owner@rihla"};
            fs.writeFileSync(p,JSON.stringify(c));' "$ID"
          pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: النشر
        if: env.SKIP != '1'
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
      - name: كلمة المرور
        if: env.SKIP != '1'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -n "$SITE_PASSWORD" ]; then
            printf '%s' "$SITE_PASSWORD" | pnpm exec wrangler secret put SITE_PASSWORD --config dist/server/wrangler.json
            printf '%s' "$SITE_PASSWORD:rihla-session" | sha256sum | cut -d' ' -f1 | tr -d '\n' | pnpm exec wrangler secret put SESSION_SECRET --config dist/server/wrangler.json
          else
            echo "::warning::ناقص SITE_PASSWORD، الدخول ما بيشتغل"
          fi
