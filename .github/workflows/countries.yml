name: بيانات الدول لرحلة
on:
  schedule:
    - cron: "23 3 1 * *"   # أول كل شهر 6:23 الصبح بتوقيت الرياض
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python countries/build_countries.py
      - name: حفظ النتيجة
        run: |
          git config user.name "rihla-bot"
          git config user.email "rihla-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add countries/data
          git diff --cached --quiet || git commit -m "تحديث بيانات الدول"
          git push
