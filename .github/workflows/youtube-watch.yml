name: متابعة يوتيوب لرحلة
on:
  schedule:
    - cron: "17 5 * * 5"   # كل جمعة 8:17 الصبح بتوقيت الرياض
  workflow_dispatch: {}     # زر تشغيل يدوي
permissions:
  contents: write
  models: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet argostranslate youtube-transcript-api
      - run: python watch.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: نصوص المقاطع
        run: python transcripts.py
        continue-on-error: true
      - name: حفظ النتيجة
        run: |
          git config user.name "rihla-bot"
          git config user.email "rihla-bot@users.noreply.github.com"
          git add data/youtube-candidates.json data/transcripts
          git diff --cached --quiet && exit 0
          git commit -m "تحديث فيديوهات يوتيوب"
          git pull --rebase origin main
          git push
