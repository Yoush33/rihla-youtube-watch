name: متابعة يوتيوب لرحلة
on:
  schedule:
    - cron: "17 5 * * 5"   # كل جمعة 8:17 الصبح بتوقيت الرياض
  workflow_dispatch: {}     # زر تشغيل يدوي
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watch.py
      - name: حفظ النتيجة
        run: |
          git config user.name "rihla-bot"
          git config user.email "rihla-bot@users.noreply.github.com"
          git add data/youtube-candidates.json
          git diff --cached --quiet || git commit -m "تحديث فيديوهات يوتيوب"
          git push
